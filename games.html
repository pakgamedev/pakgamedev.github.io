<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Made in Pakistan: Steam &amp; itch.io | PakGameDev</title>
    <meta name="description" content="Discover games made by Pakistani developers on Steam and itch.io. Community-maintained catalogues from Pakistan Game Dev (PakGameDev).">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <link rel="canonical" href="https://pakgamedev.com/games">
    <link rel="alternate" type="text/plain" href="https://pakgamedev.com/llms.txt" title="LLM summary">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pakistan Game Dev">
    <meta property="og:url" content="https://pakgamedev.com/games">
    <meta property="og:title" content="Games Made in Pakistan: Steam &amp; itch.io | PakGameDev">
    <meta property="og:description" content="Community-maintained catalogues of games made in Pakistan on Steam and itch.io.">
    <meta property="og:image" content="https://pakgamedev.com/files/preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Games Made in Pakistan: Steam &amp; itch.io | PakGameDev">
    <meta name="twitter:description" content="Community-maintained catalogues of games made in Pakistan on Steam and itch.io.">
    <meta name="twitter:image" content="https://pakgamedev.com/files/preview.png">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pakistani Games" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Games Made in Pakistan",
      "url": "https://pakgamedev.com/games",
      "description": "Community-maintained catalogues of games made in Pakistan on Steam and itch.io.",
      "isPartOf": { "@type": "WebSite", "name": "Pakistan Game Dev", "url": "https://pakgamedev.com/" }
    }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=games-banners-2">
</head>
<body>
    <div id="root">
        <main>
            <h1>Games Made in Pakistan</h1>
            <p>Community-maintained catalogues of games by Pakistani developers on Steam and itch.io, curated with Pakistan Game Dev.</p>
            <ul>
                <li><a href="https://pakgamedev.com/steam-games">Steam: Pakistani Games curator</a></li>
                <li><a href="https://pakgamedev.com/itch-games">itch.io: Pakistani games list</a></li>
            </ul>
            <p><a href="https://pakgamedev.com/">Back to Pakistan Game Dev</a></p>
        </main>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const gameLists = [
            {
                id: 1,
                title: "Steam",
                subtitle: "Pakistani Games curator",
                icon: "fa-brands fa-steam",
                color: "text-blue-400",
                url: "steam-games",
                image: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3476640/09619bf7002c8b0e1b6a89579613f007d83e4cb2/header.jpg",
                desc: "Commercial and indie titles from Pakistani developers on Steam, maintained via the Pakistani Games curator.",
                cta: "Browse Steam list"
            },
            {
                id: 2,
                title: "itch.io",
                subtitle: "Free & commercial builds",
                icon: "fa-brands fa-itch-io",
                color: "text-red-400",
                url: "itch-games",
                image: "files/itch-preview.jpg",
                desc: "Years of Pakistani games on itch.io gathered in one place: free, commercial, and experimental.",
                cta: "Browse itch list"
            }
        ];

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());

            const getOrCreateAvatarSeed = () => {
                const storageKey = 'pakgamedev_avatarSeed';
                try {
                    let seed = localStorage.getItem(storageKey);
                    if (!seed) {
                        seed = Math.random().toString(36).substring(2);
                        localStorage.setItem(storageKey, seed);
                    }
                    return seed;
                } catch (error) {
                    return Math.random().toString(36).substring(2);
                }
            };

            const [avatarSeed] = useState(getOrCreateAvatarSeed);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return (
                <div className="relative min-h-screen text-white selection:bg-green-500 selection:text-black">
                    <div className="bg-animated"></div>
                    <div className="scanlines"></div>

                    <nav className="relative z-10 flex items-center justify-between px-8 py-6 backdrop-blur-sm bg-black/20 border-b border-white/5">
                        <a href="/" className="flex items-center gap-4 no-underline text-white">
                            <div className="w-10 h-10 bg-green-600 rounded flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(22,163,74,0.6)]">
                                <img className="rounded" src="files/community-animated-icon.png" alt="Community Icon" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-wider uppercase">Pakistan Game Dev</h1>
                                <p className="text-xs text-green-400 tracking-[0.2em] uppercase">Pakistani Games</p>
                            </div>
                        </a>
                        <div className="flex items-center gap-4 text-xl font-light">
                            <i className="fa-solid fa-wifi text-xs text-green-500"></i>
                            <span className="text-lg tracking-wider">{formatTime(currentTime)}</span>
                            <div className="w-8 h-8 rounded-full bg-gray-700 overflow-hidden border border-gray-500">
                                <img src={`https://api.dicebear.com/9.x/thumbs/svg?seed=${avatarSeed}`} alt="User" />
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10 p-4 md:p-10 max-w-7xl mx-auto space-y-12">
                        <section>
                            <h2 className="text-4xl md:text-6xl font-bold mb-2">
                                PAKISTANI <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-green-600">GAMES</span>
                            </h2>
                            <p className="helper-text lead max-w-3xl">
                                Pakistani developers ship on Steam, itch.io, and beyond, and a lot of that work is easy to miss. These community-maintained lists aim to gather games made in Pakistan in one place so players can discover them and developers can see where they fit in the ecosystem.
                            </p>
                        </section>

                        <section>
                            <div className="flex items-end justify-between mb-4 px-1">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-green-500 pl-3">The Lists</h3>
                                <span className="meta-text hidden md:block">Pick a storefront</span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                                {gameLists.map((list) => (
                                    <a
                                        key={list.id}
                                        href={list.url}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="game-banner group no-underline text-white"
                                    >
                                        <div className="game-banner__media" aria-hidden="true">
                                            <img src={list.image} alt="" />
                                        </div>
                                        <div className="game-banner__shade" aria-hidden="true"></div>
                                        <div className="game-banner__body">
                                            <div className={`text-4xl md:text-5xl mb-3 ${list.color} drop-shadow-lg group-hover:scale-110 origin-left transition duration-300`}>
                                                <i className={list.icon}></i>
                                            </div>
                                            <h4 className="text-4xl md:text-5xl font-extrabold tracking-wide uppercase leading-none group-hover:text-green-400 transition-colors duration-300">
                                                {list.title}
                                            </h4>
                                            <p className="text-xs text-gray-300 uppercase tracking-[0.2em] mt-2">{list.subtitle}</p>
                                            <p className="mt-4 text-base md:text-lg text-gray-200/90 leading-snug max-w-md">
                                                {list.desc}
                                            </p>
                                            <span className="game-banner__cta">
                                                {list.cta} <i className="fa-solid fa-arrow-right"></i>
                                            </span>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        </section>

                        <section className="glass-panel glass-static rounded-xl p-6 md:p-8">
                            <h3 className="text-xl font-bold tracking-widest uppercase mb-3">Why this exists</h3>
                            <p className="helper-text mb-0 max-w-3xl">
                                There is no single storefront filter for “made in Pakistan.” These catalogues are a practical workaround: curated Steam coverage for released commercial titles, and a broader itch.io collection that catches free games, prototypes, and jam entries the wider scene would otherwise overlook.
                            </p>
                        </section>

                        <footer className="mt-12 py-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center text-gray-200 text-sm">
                            <a href="/" className="hover:text-white transition mb-4 md:mb-0">← Back home</a>
                            <div>&copy; 2026 PakGameDev Community.</div>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
