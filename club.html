    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body>
    <div id="root">
        <main>
            <h1>Pakistan Game Dev Club</h1>
            <p>Play one new game every week and discuss design with Pakistani game developers and students. Conversations happen on the PakGameDev Discord.</p>
            <p><a href="https://pakgamedev.com/discord">Join Discord</a> · <a href="https://pakgamedev.com/">Home</a></p>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
        import {
            getFirestore,
            collection,
            doc,
            onSnapshot,
            getDoc,
            runTransaction,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDqvti-PChTusPiGL0CsGndzR6ppz_ls5c",
            authDomain: "pakgamedev-com.firebaseapp.com",
            projectId: "pakgamedev-com",
            storageBucket: "pakgamedev-com.firebasestorage.app",
            messagingSenderId: "482266938106",
            appId: "1:482266938106:web:bad5c2745289a25b246743"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = firebaseConfig.appId;

        window.FB = {
            auth, db, appId,
            signInAnonymously, onAuthStateChanged,
            collection, doc, onSnapshot, getDoc, runTransaction, serverTimestamp
        };
        window.dispatchEvent(new Event('fb-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const DISCORD_INVITE = "https://pakgamedev.com/discord";
        const SOCIAL_LINKS = [
            { title: "Discord", icon: "fa-brands fa-discord", url: DISCORD_INVITE },
            { title: "Reddit", icon: "fa-brands fa-reddit-alien", url: "https://www.reddit.com/r/PakGameDev" },
            { title: "Bluesky", icon: "fa-brands fa-bluesky", url: "https://bsky.app/profile/pakgamedev.com" },
            { title: "LinkedIn", icon: "fa-brands fa-linkedin", url: "https://www.linkedin.com/company/pakgamedev" },
            { title: "Instagram", icon: "fa-brands fa-instagram", url: "https://www.instagram.com/pakgamedev" },
            { title: "TikTok", icon: "fa-brands fa-tiktok", url: "https://www.tiktok.com/@pakgamedev" },
            { title: "YouTube", icon: "fa-brands fa-youtube", url: "https://www.youtube.com/@PakGameDev" },
        ];

        function waitForFB() {
            return new Promise((resolve) => {
                if (window.FB) return resolve(window.FB);
                const onReady = () => {
                    window.removeEventListener('fb-ready', onReady);
                    resolve(window.FB);
                };
                window.addEventListener('fb-ready', onReady);
            });
        }

        const CurrentGameHero = ({ user, fbReady }) => {
            const [currentGame, setCurrentGame] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!fbReady || !user) return;
                const { db, appId, doc, onSnapshot } = window.FB;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'current', 'game');
                const unsubscribe = onSnapshot(docRef, (snapshot) => {
                    setCurrentGame(snapshot.exists() ? snapshot.data() : null);
                    setLoading(false);
                }, (err) => {
                    console.error("Current Game error", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user, fbReady]);

            if (!fbReady || !user || loading) {
                return (
                    <section className="relative w-full h-[360px] md:h-[480px] rounded-3xl overflow-hidden border border-white/5 flex flex-col items-center justify-center p-8 text-center hero-glow">
                        <p className="text-green-400 font-mono text-sm tracking-[0.25em] uppercase animate-pulse">Loading this week's game…</p>
                    </section>
                );
            }

            if (!currentGame) {
                return (
                    <section className="relative w-full h-[360px] md:h-[480px] rounded-3xl overflow-hidden border border-green-500/20 flex flex-col items-center justify-center p-8 text-center hero-glow">
                        <div className="absolute inset-0 z-0 bg-black/40">
                            <div className="w-full h-full opacity-10 bg-[radial-gradient(#22c55e_1px,transparent_1px)] [background-size:20px_20px]"></div>
                        </div>
                        <div className="relative z-10 space-y-4 max-w-xl">
                            <div className="w-20 h-20 mx-auto bg-white/5 rounded-full flex items-center justify-center border border-white/10">
                                <i className="fa-solid fa-microchip text-3xl text-gray-500"></i>
                            </div>
                            <h2 className="text-3xl md:text-5xl font-bold tracking-tighter uppercase glitch-text">
                                Next game is being chosen.
                            </h2>
                            <p className="text-green-500 font-mono text-sm tracking-[0.2em] uppercase opacity-80">
                                Ready Monday morning · meanwhile upvote the queue below
                            </p>
                        </div>
                    </section>
                );
            }

            const discussUrl = currentGame.discord_thread_url || DISCORD_INVITE;

            return (
                <section className="relative w-full h-[400px] md:h-[500px] rounded-3xl overflow-hidden border border-green-500/20 group hero-glow">
                    <div className="absolute inset-0 z-0">
                        <img
                            src={currentGame.header_image}
                            className="w-full h-full object-cover opacity-50 group-hover:scale-105 transition-transform duration-1000"
                            alt=""
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0f172a] via-[#0f172a]/40 to-transparent"></div>
                        <div className="absolute inset-0 bg-gradient-to-r from-[#0f172a] via-transparent to-transparent"></div>
                    </div>

                    <div className="relative z-10 h-full flex flex-col justify-end p-8 md:p-12">
                        <div className="space-y-6 max-w-3xl">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/20 border border-green-500/30 text-green-400 text-xs font-bold tracking-[0.2em] uppercase">
                                <span className="relative flex h-2 w-2">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                </span>
                                Now Playing
                            </div>

                            {currentGame.library_logo ? (
                                <img
                                    src={currentGame.library_logo}
                                    className="max-h-20 md:max-h-[11rem] object-contain filter drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]"
                                    alt={currentGame.name}
                                />
                            ) : (
                                <h2 className="line-clamp-2 text-4xl md:text-7xl font-bold uppercase tracking-tighter text-glow">
                                    {currentGame.name}
                                </h2>
                            )}

                            <div className="flex flex-wrap items-center gap-4">
                                <a
                                    href={currentGame.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-8 py-3 bg-green-600 hover:bg-green-500 text-black font-bold uppercase tracking-widest rounded-lg transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(22,163,74,0.4)]"
                                >
                                    Start Playing
                                </a>
                                <a
                                    href={discussUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-8 py-3 bg-transparent border-2 border-green-600 hover:bg-green-200/10 text-green-500 font-bold uppercase tracking-widest rounded-lg transition-all transform hover:scale-105 active:scale-95"
                                >
                                    Discuss on Discord
                                </a>
                            </div>
                            {currentGame.doc_id === "steam-next-fest" ? (
                                <p className="text-lg text-slate-200">Bonus free-for-all week: play any demo from Next Fest. At least one demo per day is recommended.</p>
                            ) : (
                                <p className="text-lg text-slate-200">Download, play, and analyze. Discuss in this week's Discord thread by Sunday 11pm PKT.</p>
                            )}
                        </div>
                    </div>
                </section>
            );
        };

        const HowItWorks = () => (
            <section className="space-y-6">
                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-green-500 pl-3 text-glow">How it works</h3>
                <ol className="grid md:grid-cols-2 gap-4 list-none p-0 m-0">
                    {[
                        { n: "1", t: "Join Discord", d: "Grab the PakGameDev invite below and pick up the Game Dev Club role get pings on Monday." },
                        { n: "2", t: "Play this week's game", d: "Any time from Monday morning through Sunday 11pm PKT. Take notes while playing." },
                        { n: "3", t: "Discuss on Discord", d: "What did you like? What didn't you like? And why? Post thoughts in that week's forum thread." },
                        { n: "4", t: "Upvote what's next", d: "Highest-voted queue games are chosen first on Monday. Suggest new titles on discord." },
                    ].map((step) => (
                        <li key={step.n} className="glass-panel glass-static rounded-xl p-5 flex gap-4">
                            <span className="text-green-500 font-mono text-2xl font-bold">{step.n}</span>
                            <div>
                                <p className="font-bold uppercase tracking-wide text-white">{step.t}</p>
                                <p className="text-slate-300 text-sm mt-1 leading-relaxed">{step.d}</p>
                            </div>
                        </li>
                    ))}
                </ol>
            </section>
        );

        const QueuedGames = ({ user, fbReady }) => {
            const [games, setGames] = useState([]);
            const [loading, setLoading] = useState(true);
            const [myVotes, setMyVotes] = useState({});
            const [busyId, setBusyId] = useState(null);

            useEffect(() => {
                if (!fbReady || !user) return;
                const { db, appId, collection, onSnapshot } = window.FB;
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'games');
                const unsubscribe = onSnapshot(colRef, (snapshot) => {
                    const gamesList = snapshot.docs.map((d) => ({
                        id: d.id,
                        ...d.data()
                    }));
                    gamesList.sort((a, b) => (Number(b.votes) || 0) - (Number(a.votes) || 0) || (a.name || '').localeCompare(b.name || ''));
                    setGames(gamesList);
                    setLoading(false);
                }, (err) => {
                    console.error("Queue error", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user, fbReady]);

            useEffect(() => {
                if (!fbReady || !user || games.length === 0) {
                    setMyVotes({});
                    return;
                }
                let cancelled = false;
                const { db, appId, doc, getDoc } = window.FB;
                (async () => {
                    const voted = {};
                    await Promise.all(games.map(async (g) => {
                        const voteRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', g.id, 'votes', user.uid);
                        const snap = await getDoc(voteRef);
                        voted[g.id] = snap.exists();
                    }));
                    if (!cancelled) setMyVotes(voted);
                })();
                return () => { cancelled = true; };
            }, [user, fbReady, games]);

            const toggleVote = useCallback(async (gameId) => {
                if (!user || busyId) return;
                setBusyId(gameId);
                const { db, appId, doc, runTransaction, serverTimestamp } = window.FB;
                const voteRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', gameId, 'votes', user.uid);
                const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', gameId);
                try {
                    await runTransaction(db, async (transaction) => {
                        const voteSnap = await transaction.get(voteRef);
                        const gameSnap = await transaction.get(gameRef);
                        if (!gameSnap.exists()) return;
                        const currentVotes = Number(gameSnap.data().votes) || 0;
                        if (voteSnap.exists()) {
                            transaction.delete(voteRef);
                            transaction.update(gameRef, { votes: Math.max(0, currentVotes - 1) });
                        } else {
                            transaction.set(voteRef, { created_at: serverTimestamp() });
                            transaction.update(gameRef, { votes: currentVotes + 1 });
                        }
                    });
                } catch (err) {
                    console.error("Vote failed", err);
                } finally {
                    setBusyId(null);
                }
            }, [user, busyId]);

            return (
                <section className="mt-4 space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-2 px-1">
                        <div>
                            <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-green-500 pl-3 text-glow">Upcoming queue</h3>
                            <p className="helper-text mt-2 max-w-2xl">Upvote to push a game toward Monday. Top votes win (ties are random).</p>
                        </div>
                    </div>

                    {loading || !user ? (
                        <p className="text-slate-400 font-mono text-sm tracking-widest uppercase animate-pulse">Loading queue…</p>
                    ) : games.length === 0 ? (
                        <div className="glass-panel glass-static rounded-xl p-8 text-center text-slate-300">
                            Queue is empty. Suggest a game in Discord chat.
                        </div>
                    ) : (
                        <div className="grid grid-cols-10 gap-3">
                            {games.map((game) => {
                                const voted = !!myVotes[game.id];
                                const votes = Number(game.votes) || 0;
                                return (
                                    <div key={game.id} className="glass-panel glass-static rounded-xl overflow-hidden flex flex-col">
                                        <a href={game.url} target="_blank" rel="noopener noreferrer" className="relative aspect-square block overflow-hidden">
                                            <img
                                                src={game.icon_image || 'https://via.placeholder.com/150'}
                                                alt={game.name}
                                                className="no-filter w-full h-full object-cover transition-transform duration-300 hover:scale-110"
                                            />
                                        </a>
                                        <div className="p-3 flex flex-col gap-2 flex-1">
                                            <p className="text-xs font-bold uppercase leading-snug line-clamp-2 min-h-[2.5rem]">{game.name}</p>
                                            <button
                                                type="button"
                                                disabled={busyId === game.id}
                                                onClick={() => toggleVote(game.id)}
                                                className={`flex items-center justify-center gap-2 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-colors ${
                                                    voted
                                                        ? 'bg-green-600 text-black'
                                                        : 'bg-white/5 border border-white/10 text-green-400 hover:bg-green-500/20'
                                                }`}
                                            >
                                                <i className={`fa-solid fa-caret-up ${voted ? '' : 'opacity-70'}`}></i>
                                                {votes}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </section>
            );
        };

        const PastGames = ({ user, fbReady }) => {
            const [games, setGames] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!fbReady || !user) return;
                const { db, appId, collection, onSnapshot } = window.FB;
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'past');
                const unsubscribe = onSnapshot(colRef, (snapshot) => {
                    const gamesList = snapshot.docs.map((d) => ({
                        id: d.id,
                        ...d.data()
                    }));
                    gamesList.sort((a, b) => {
                        const ta = a.archived_at?.seconds || 0;
                        const tb = b.archived_at?.seconds || 0;
                        return tb - ta;
                    });
                    setGames(gamesList);
                    setLoading(false);
                }, (err) => {
                    console.error("Past games error", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user, fbReady]);

            if (loading || !user) {
                return (
                    <section className="mt-4">
                        <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-cyan-500 pl-3 text-glow mb-6">Previously played</h3>
                        <p className="text-slate-400 font-mono text-sm tracking-widest uppercase animate-pulse">Loading archive…</p>
                    </section>
                );
            }

            if (games.length === 0) return null;

            return (
                <section className="mt-4">
                    <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-cyan-500 pl-3 text-glow mb-6">Previously played</h3>
                    <div className="grid grid-cols-[repeat(16,minmax(0,1fr))] gap-3">
                        {games.map((game) => (
                            <a
                                href={game.url}
                                target="_blank"
                                rel="noopener noreferrer"
                                key={game.id}
                                className="group glass-panel glass-static rounded-lg overflow-hidden"
                            >
                                <div className="aspect-square overflow-hidden">
                                    <img
                                        src={game.icon_image || 'https://via.placeholder.com/150'}
                                        alt={game.name}
                                        className="no-filter w-full h-full object-cover transition-transform duration-300 group-hover:scale-110"
                                    />
                                </div>
                                <p className="p-2 text-[10px] text-center font-bold uppercase leading-tight line-clamp-2 text-slate-300">{game.name}</p>
                            </a>
                        ))}
                    </div>
                </section>
            );
        };

        const FollowSection = () => (
            <section className="space-y-4 border-t border-white/5 pt-12">
                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-green-500 pl-3 text-glow">Get notified</h3>
                <p className="helper-text max-w-2xl">
                    Monday Discord announcement pings the club role. Or follow the channels below for the weekly pick. Discussion always only on Discord.
                </p>
                <div className="flex flex-wrap gap-3">
                    {SOCIAL_LINKS.map((s) => (
                        <a
                            key={s.title}
                            href={s.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-white/5 border border-white/10 hover:border-green-500/40 hover:bg-green-500/10 transition text-sm font-bold uppercase tracking-wider"
                        >
                            <i className={s.icon}></i>
                            {s.title}
                        </a>
                    ))}
                </div>
            </section>
        );

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [fbReady, setFbReady] = useState(!!window.FB);
            const [user, setUser] = useState(null);

            const getOrCreateAvatarSeed = () => {
                const storageKey = 'pakgamedev_avatarSeed';
                try {
                    let seed = localStorage.getItem(storageKey);
                    if (!seed) {
                        seed = Math.random().toString(36).substring(2);
                        localStorage.setItem(storageKey, seed);
                    }
                    return seed;
                } catch (error) {
                    return Math.random().toString(36).substring(2);
                }
            };

            const [avatarSeed] = useState(getOrCreateAvatarSeed);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                let unsubAuth = () => {};
                (async () => {
                    const FB = await waitForFB();
                    setFbReady(true);
                    try {
                        await FB.signInAnonymously(FB.auth);
                    } catch (e) {
                        console.error("Auth failed", e);
                    }
                    unsubAuth = FB.onAuthStateChanged(FB.auth, (u) => setUser(u));
                })();
                return () => unsubAuth();
            }, []);

            const formatTime = (date) =>
                date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return (
                <div className="relative min-h-screen text-white selection:bg-green-500 selection:text-black">
                    <div className="bg-animated"></div>
                    <div className="scanlines"></div>

                    <nav className="relative z-10 flex items-center justify-between px-8 py-6 backdrop-blur-sm bg-black/20 border-b border-white/5">
                        <a href="/" className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-green-600 rounded flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(22,163,74,0.6)]">
                                <img className="rounded" src="https://styles.redditmedia.com/t5_ckbq64/styles/communityIcon_ooei9a15xprd1.png" alt="" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-wider uppercase">Pak Game Dev</h1>
                                <p className="text-xs text-green-400 tracking-[0.2em] uppercase">Community Hub</p>
                            </div>
                        </a>

                        <div className="flex items-center gap-4 text-xl font-light">
                            <i className="fa-solid fa-wifi text-xs text-green-500"></i>
                            <span className="text-lg tracking-wider">{formatTime(currentTime)}</span>
                            <div className="w-8 h-8 rounded-full bg-gray-700 overflow-hidden border border-gray-500">
                                <img src={`https://api.dicebear.com/9.x/thumbs/svg?seed=${avatarSeed}`} alt="User" />
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10 p-4 md:p-10 max-w-7xl mx-auto space-y-16">
                        <section className="mb-4">
                            <h2 className="text-4xl md:text-6xl font-bold mb-2 uppercase">
