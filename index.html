<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakistan Game Dev - Game Development Community in Pakistan</title>
    <meta property="og:title" content="Pakistan Game Dev">
    <meta property="og:image" content="https://pakgamedev.com/files/preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://pakgamedev.com/files/preview.png">
    <meta name="description" content="PakGameDev is a tight knit community of Game Developers, indies, hobbyists, artists and creatives. Connect with the Pakistani game development ecosystem, join jams, showcase your work, find resources, collaborations, support and level up together.">
    <meta property="og:description" content="PakGameDev is a tight knit community of Game Developers, indies, hobbyists, artists and creatives. Connect with the Pakistani game development ecosystem, join jams, showcase your work, find resources, collaborations, support and level up together.">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pak Game Dev" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Rajdhani for that "Sci-Fi/Gamer" look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=pillar-tiles-2">
    <script src="data/content-data.js"></script>
    <script src="js/content.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const aboutPillars = [
            {
                id: 1,
                title: "Jams",
                blurb: "Join an upcoming jam and make games together under a shared theme and deadline.",
                icon: "fa-solid fa-trophy",
                color: "text-yellow-400",
                url: "jams",
                image: "https://img.itch.zone/aW1nLzI4MTAzNjI3LnBuZw==/original/aa%2Bx0d.png"
            },
            {
                id: 2,
                title: "Playtests",
                blurb: "Submit your game for playtests, give feedback and share knowledge.",
                icon: "fa-solid fa-gamepad",
                color: "text-cyan-400",
                url: "playtests",
                image: "https://images.unsplash.com/photo-1687977686478-13b75f82225e?q=80&w=1200&auto=format&fit=crop"
            },
            {
                id: 3,
                title: "Game Design Discussions",
                blurb: "Play one game a week and dig into design together.",
                icon: "fa-solid fa-comments",
                color: "text-purple-400",
                url: "club",
                image: "https://images.unsplash.com/photo-1540634759006-203f597e1a34?q=80&w=1200&auto=format&fit=crop"
            },
            {
                id: 4,
                title: "Events",
                blurb: "Steam showcases, awards, and gatherings for Pakistani games.",
                icon: "fa-solid fa-calendar-days",
                color: "text-orange-400",
                url: "events",
                image: "https://i.redd.it/lc1aepfiuofh1.jpeg"
            },
            {
                id: 5,
                title: "Pakistani Games",
                blurb: "Catalogues of games made in Pakistan on Steam and itch.io.",
                icon: "fa-solid fa-globe",
                color: "text-green-400",
                url: "games",
                image: "files/itch-preview.jpg"
            }
        ];

        const socialLinks = [
            { id: 1, title: "Discord", icon: "fa-brands fa-discord", color: "text-indigo-400", url: "discord" },
            { id: 2, title: "Reddit", icon: "fa-brands fa-reddit-alien", color: "text-orange-500", url: "https://www.reddit.com/r/PakGameDev" },
            { id: 3, title: "LinkedIn", icon: "fa-brands fa-linkedin", color: "text-sky-400", url: "https://www.linkedin.com/company/pakgamedev" },
            { id: 4, title: "YouTube", icon: "fa-brands fa-youtube", color: "text-red-500", url: "https://www.youtube.com/@PakGameDev" },
            { id: 5, title: "Instagram", icon: "fa-brands fa-instagram", color: "text-pink-400", url: "https://www.instagram.com/pakgamedev" },
            { id: 6, title: "Bluesky", icon: "fa-brands fa-bluesky", color: "text-sky-300", url: "https://bsky.app/profile/pakgamedev.com" },
            { id: 7, title: "TikTok", icon: "fa-brands fa-tiktok", color: "text-white", url: "https://www.tiktok.com/@pakgamedev" }
        ];

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [featuredItem, setFeaturedItem] = useState(null);
            const [newsItems, setNewsItems] = useState([]);
            const [contentLoading, setContentLoading] = useState(true);

            // Function to safely check localStorage for a seed, or create a new one.
            const getOrCreateAvatarSeed = () => {
                const storageKey = 'pakgamedev_avatarSeed';
                
                // Use a try/catch block for safer localStorage access
                try {
                    let seed = localStorage.getItem(storageKey);
                    if (!seed) {
                        // If no seed exists, generate a new one
                        seed = Math.random().toString(36).substring(2);
                        localStorage.setItem(storageKey, seed);
                    }
                    return seed;
                } catch (error) {
                    // Fallback if localStorage is unavailable or throws an error
                    console.error("Could not access localStorage. Using temporary random seed.", error);
                    return Math.random().toString(36).substring(2);
                }
            };
            
            // Initialize the state by calling the function
            const [avatarSeed] = useState(getOrCreateAvatarSeed);

            // Clock update
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                PakContent.load()
                    .then((data) => {
                        const latest = PakContent.latest(data);
                        setFeaturedItem(latest);
                        setNewsItems(PakContent.news(data, latest && latest.type === 'news' ? latest.id : null));
                        setContentLoading(false);
                    })
                    .catch((err) => {
                        console.error(err);
                        setContentLoading(false);
                    });
            }, []);

            const formatTime = (date) => {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            };

            return (
                <div className="relative min-h-screen text-white selection:bg-green-500 selection:text-black">
                    <div className="bg-animated"></div>
                    <div className="scanlines"></div>
                    
                    {/* Top Navigation Bar */}
                    <nav className="relative z-10 flex items-center justify-between px-8 py-6 backdrop-blur-sm bg-black/20 border-b border-white/5">
                        <div className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-green-600 rounded flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(22,163,74,0.6)]">
                                <img className="rounded" src="files/community-animated-icon.png" alt="Community Icon" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-wider uppercase">Pakistan Game Dev</h1>
                                <p className="text-xs text-green-400 tracking-[0.2em] uppercase">Community in Pakistan</p>
                            </div>
                        </div>


                        <a href="awards" className="hidden md:flex items-center gap-4">
                            <img className="w-10 h-[12.9]" src="files/awards_logo.png" alt="Awards Logo" />
                            <div className="mt-0 mb-0">
                                <h1 className="text-2xl font-bold tracking-wider uppercase leading-[0.75]">Pak<br/>Game<br/>Awards</h1>
                            </div>
                        </a>

                        <div className="flex items-center gap-4 text-xl font-light">
                            <i className="fa-solid fa-wifi text-xs text-green-500"></i>
                            <span className="text-lg tracking-wider">{formatTime(currentTime)}</span>
                            <div className="w-8 h-8 rounded-full bg-gray-700 overflow-hidden border border-gray-500">
                                <img src={`https://api.dicebear.com/9.x/thumbs/svg?seed=${avatarSeed}`} alt="User" />
                            </div>
                        </div>
                    </nav>

                    {/* Main Content Dashboard */}
                    <main className="relative z-10 p-4 md:p-10 max-w-7xl mx-auto space-y-12">
                        
                        {/* Hero / Welcome */}
                        <section className="mb-8">
                            <h2 className="text-4xl md:text-6xl font-bold mb-2">
                                WELCOME TO <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-green-600">PAKISTAN GAME DEV COMMUNITY</span>
                            </h2>
                            <p className="helper-text lead max-w-5xl">
                                Here is a tight knit community of Game Developers, indies, hobbyists, artists and creatives. Connect with the Pakistani game development ecosystem, join jams, showcase your work, find resources, collaborations, support and level up together.
                            </p>
                        </section>

                        {/* FEATURED — latest catalogue item of any type */}
                        <section className="mb-12">
                            {contentLoading && (
                                <p className="helper-text">Loading…</p>
                            )}
                            {!contentLoading && featuredItem && (
                                <a target="_blank" rel="noopener noreferrer" href={featuredItem.url} className="block glass-panel rounded-xl overflow-hidden transition-all duration-500 hover:shadow-[0_0_40px_rgba(22,163,74,0.6)] group">
                                    <div className="flex flex-col md:flex-row items-center p-6 md:p-8">
                                        <div className="md:w-1/4 relative mb-4 md:mb-0 rounded-xl overflow-hidden h-48 w-full bg-black/40">
                                            <img 
                                                src={featuredItem.image} 
                                                alt={featuredItem.title} 
                                                className="absolute inset-0 w-full h-full object-cover opacity-40 group-hover:opacity-90 transition-opacity duration-500" 
                                            />
                                        </div>
                                        <div className="md:w-3/4 md:pl-8 text-center md:text-left">
                                            <span className="text-xs text-gray-400 font-semibold uppercase tracking-widest block mb-1">{PakContent.labelFor(featuredItem)} | {featuredItem.date}</span>
                                            <h3 className="text-3xl md:text-4xl font-extrabold tracking-wider leading-tight mb-2 group-hover:text-green-400 transition">
                                                {featuredItem.title}
                                            </h3>
                                            <p className="text-gray-300 max-w-xl mx-auto md:mx-0 text-xl">{featuredItem.desc}</p>
                                            <div className="mt-3 flex justify-center md:justify-start items-center text-sm font-bold text-green-500 uppercase tracking-widest">
                                                <span className="mr-2">SEE NOW</span> <i className="fa-solid fa-arrow-right animate-pulse"></i>
                                            </div>
                                        </div>
                                    </div>
                                </a>
                            )}
                        </section>


                        {/* About the community */}
                        <section>
                            <div className="flex items-end justify-between mb-4 px-1">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-green-500 pl-3">What We Do</h3>
                                <span className="meta-text hidden md:block">The community at work</span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 md:gap-5">
                                {aboutPillars.map((pillar, index) => (
                                    <a
                                        key={pillar.id}
                                        href={pillar.url}
                                        {...(pillar.url.startsWith('http') ? { target: '_blank', rel: 'noopener noreferrer' } : {})}
                                        className={`pillar-tile group no-underline text-white lg:col-span-2${index === 3 ? ' lg:col-start-2' : ''}`}
                                    >
                                        <div className="pillar-tile__media" aria-hidden="true">
                                            <img src={pillar.image} alt="" />
                                        </div>
                                        <div className="pillar-tile__shade" aria-hidden="true"></div>
                                        <div className="pillar-tile__body">
                                            <div className={`text-2xl md:text-3xl mb-2 ${pillar.color} drop-shadow-lg group-hover:scale-110 origin-left transition duration-300`}>
                                                <i className={pillar.icon}></i>
                                            </div>
                                            <h4 className="text-xl md:text-2xl font-extrabold tracking-wide uppercase leading-tight group-hover:text-green-400 transition-colors duration-300">{pillar.title}</h4>
                                            <p className="mt-1.5 text-sm text-gray-200/90 leading-snug line-clamp-2">{pillar.blurb}</p>
                                            <span className="pillar-tile__cta">
                                                Explore <i className="fa-solid fa-arrow-right"></i>
                                            </span>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        </section>

                        {/* Join / socials */}
                        <section>
                            <div className="flex items-end justify-between mb-4 px-1">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-sky-500 pl-3">Join Us</h3>
                                <span className="meta-text hidden md:block">Find your channel</span>
                            </div>

                            <div className="join-row glass-panel glass-static rounded-xl px-4 py-6 md:px-8 flex flex-wrap items-center justify-center gap-4 md:gap-6">
                                {socialLinks.map((social) => (
                                    <a
                                        key={social.id}
                                        href={social.url}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        title={social.title}
                                        aria-label={social.title}
                                        className="join-icon group no-underline flex flex-col items-center gap-2 w-16 md:w-20"
                                    >
                                        <span className={`w-12 h-12 md:w-14 md:h-14 rounded-full border border-white/10 bg-white/5 flex items-center justify-center text-2xl md:text-3xl ${social.color} group-hover:border-green-500/50 group-hover:bg-white/10 group-hover:scale-110 transition duration-300`}>
                                            <i className={social.icon}></i>
                                        </span>
                                        <span className="text-[10px] md:text-xs uppercase tracking-wider text-gray-400 group-hover:text-green-400 transition">{social.title}</span>
                                    </a>
                                ))}
                            </div>
                        </section>

                        {/* News & Announcements Section */}
                        <section>
                            <div className="flex items-end justify-between mb-4 px-1">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-purple-500 pl-3">Latest News</h3>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {!contentLoading && newsItems.map((news) => (
                                    <a target="_blank" rel="noopener noreferrer" href={news.url} key={news.id} className="glass-panel p-0 rounded-xl flex flex-col md:flex-row h-auto md:h-48 overflow-hidden group cursor-pointer transition-all duration-300 hover:shadow-[0_0_30px_rgba(255,255,255,0.05)]">
                                        <div className="md:w-2/5 relative overflow-hidden h-48 md:h-full">
                                            <img src={news.image} alt={news.title} className="w-full h-full object-cover transition duration-700 group-hover:scale-110" />
                                            <div className="absolute top-2 left-2 bg-black/80 backdrop-blur text-[10px] font-bold px-2 py-1 rounded text-white uppercase tracking-widest border border-white/10">
                                                {PakContent.labelFor(news)}
                                            </div>
                                        </div>
                                        <div className="md:w-3/5 p-6 flex flex-col justify-center relative">
                                            <div className="flex items-center gap-2 mb-2">
                                                <span className="text-xs text-gray-400 uppercase tracking-wider group-hover:text-gray-200">{news.date}</span>
                                            </div>
                                            <h4 className="text-xl font-bold mb-2 leading-tight group-hover:text-green-400 transition">{news.title}</h4>
                                            <p className="text-l text-gray-400 line-clamp-2 group-hover:text-gray-200">{news.desc}</p>
                                            <div className="mt-4 flex items-center gap-2 text-xs font-bold text-green-500 uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity transform translate-x-[-10px] group-hover:translate-x-0">
                                                Learn More <i className="fa-solid fa-arrow-right"></i>
                                            </div>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        </section>
                        
                        {/* Footer / Status Bar */}
                        <footer className="mt-12 py-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center text-gray-200 text-sm">
                            <div className="flex gap-6 mb-4 md:mb-0">
                                <a href="#" className="hover:text-white transition">Privacy</a>
                                <a href="#" className="hover:text-white transition">Terms</a>
                                <a href="#" className="hover:text-white transition">Contact</a>
                            </div>
                            <div className="flex items-center gap-2">
                                <span>SYSTEM STATUS:</span>
                                <span className="text-green-500 font-bold">ONLINE</span>
                                <span className="w-2 h-2 bg-green-500 rounded-full animate-ping ml-1"></span>
                            </div>
                            <div className="mt-4 md:mt-0">
                                &copy; 2026 PakGameDev Community.
                            </div>
                        </footer>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
