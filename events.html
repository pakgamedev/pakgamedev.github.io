<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakistani Game Events &amp; Showcases | Pakistan Game Dev</title>
    <meta name="description" content="Steam showcases, Pak Game Awards, and community gatherings for Pakistani game developers, students, and players, organized with PakGameDev.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <link rel="canonical" href="https://pakgamedev.com/events">
    <link rel="alternate" type="text/plain" href="https://pakgamedev.com/llms.txt" title="LLM summary">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pakistan Game Dev">
    <meta property="og:url" content="https://pakgamedev.com/events">
    <meta property="og:title" content="Pakistani Game Events &amp; Showcases | Pakistan Game Dev">
    <meta property="og:description" content="Steam showcases, awards, and gatherings for Pakistani game developers and players.">
    <meta property="og:image" content="https://pakgamedev.com/files/preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pakistani Game Events &amp; Showcases | Pakistan Game Dev">
    <meta name="twitter:description" content="Steam showcases, awards, and gatherings for Pakistani game developers and players.">
    <meta name="twitter:image" content="https://pakgamedev.com/files/preview.png">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pak Game Dev Events" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Pakistani Game Events",
      "url": "https://pakgamedev.com/events",
      "description": "Steam showcases, awards, and community gatherings for Pakistani game developers and players.",
      "isPartOf": { "@type": "WebSite", "name": "Pakistan Game Dev", "url": "https://pakgamedev.com/" }
    }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=events-banners">
    <script src="data/content-data.js?v=urdu"></script>
    <script src="js/content.js?v=urdu"></script>
</head>
<body>
    <div id="root">
        <main>
            <h1>Pakistani Game Events</h1>
            <p>Steam showcases, Pak Game Awards, and community gatherings highlighting games and developers from Pakistan. Organized with the Pakistan Game Dev community.</p>
            <p><a href="https://pakgamedev.com/">Back to Pakistan Game Dev</a></p>
        </main>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const isLogoImage = (src) => {
            if (!src) return false;
            return src.startsWith('files/') || src.includes('et737ket737ket73');
        };

        const EventBanner = ({ event, badge }) => {
            const logo = isLogoImage(event.image);
            return (
                <a
                    href={event.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className={`event-banner group no-underline text-white ${logo ? 'event-banner--logo' : ''}`}
                >
                    <div className="event-banner__media" aria-hidden="true">
                        <img src={event.image} alt="" />
                    </div>
                    <div className="event-banner__shade" aria-hidden="true"></div>
                    <div className="event-banner__body">
                        <span className="inline-flex items-center gap-2 text-xs md:text-sm font-semibold uppercase tracking-[0.25em] text-green-400 mb-3">
                            <span className="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.8)]"></span>
                            {badge} · {event.date}
                        </span>
                        <h3 className="text-4xl md:text-6xl lg:text-7xl font-extrabold tracking-wide leading-[0.95] uppercase group-hover:text-green-400 transition-colors duration-300">
                            {event.title}
                        </h3>
                        <p className="mt-4 text-lg md:text-2xl text-gray-200/90 max-w-2xl leading-snug">
                            {event.desc}
                        </p>
                        <span className="event-banner__cta">
                            Explore event <i className="fa-solid fa-arrow-right"></i>
                        </span>
                    </div>
                </a>
            );
        };

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [featuredEvent, setFeaturedEvent] = useState(null);
            const [pastEvents, setPastEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const getOrCreateAvatarSeed = () => {
                const storageKey = 'pakgamedev_avatarSeed';
                try {
                    let seed = localStorage.getItem(storageKey);
                    if (!seed) {
                        seed = Math.random().toString(36).substring(2);
                        localStorage.setItem(storageKey, seed);
                    }
                    return seed;
                } catch (err) {
                    return Math.random().toString(36).substring(2);
                }
            };

            const [avatarSeed] = useState(getOrCreateAvatarSeed);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                PakContent.load()
                    .then((data) => {
                        setFeaturedEvent(PakContent.featured(data, 'event'));
                        setPastEvents(PakContent.past(data, 'event'));
                        setLoading(false);
                    })
                    .catch((err) => {
                        console.error(err);
                        setError('Could not load events.');
                        setLoading(false);
                    });
            }, []);

            const formatTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return (
                <div className="relative min-h-screen text-white selection:bg-green-500 selection:text-black">
                    <div className="bg-animated"></div>
                    <div className="scanlines"></div>

                    <nav className="relative z-10 flex items-center justify-between px-8 py-6 backdrop-blur-sm bg-black/20 border-b border-white/5">
                        <a href="/" className="flex items-center gap-4 no-underline text-white">
                            <div className="w-10 h-10 bg-green-600 rounded flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(22,163,74,0.6)]">
                                <img className="rounded" src="files/community-animated-icon.png" alt="Community Icon" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-wider uppercase">Pakistan Game Dev</h1>
                                <p className="text-xs text-green-400 tracking-[0.2em] uppercase">Events</p>
                            </div>
                        </a>
                        <div className="flex items-center gap-4 text-xl font-light">
                            <i className="fa-solid fa-wifi text-xs text-green-500"></i>
                            <span className="text-lg tracking-wider">{formatTime(currentTime)}</span>
                            <div className="w-8 h-8 rounded-full bg-gray-700 overflow-hidden border border-gray-500">
                                <img src={`https://api.dicebear.com/9.x/thumbs/svg?seed=${avatarSeed}`} alt="User" />
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10 px-4 md:px-8 lg:px-10 py-8 md:py-12 max-w-[90rem] mx-auto space-y-10 md:space-y-14">
                        <section className="max-w-4xl">
                            <h2 className="text-4xl md:text-6xl font-bold mb-3 tracking-wide">
                                COMMUNITY <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-green-600">EVENTS</span>
                            </h2>
                            <p className="helper-text lead mb-0">
                                Showcases, awards, and gatherings that put Pakistani games on a bigger stage.
                            </p>
                        </section>

                        {loading && (
                            <p className="helper-text">Loading events…</p>
                        )}
                        {error && (
                            <p className="text-red-400">{error}</p>
                        )}

                        {!loading && !error && (
                            <div className="space-y-8 md:space-y-10">
                                {featuredEvent ? (
                                    <section className="space-y-4">
                                        <h3 className="text-sm font-bold tracking-[0.3em] uppercase text-orange-400 px-1">Upcoming</h3>
                                        <EventBanner event={featuredEvent} badge="Upcoming" />
                                    </section>
                                ) : (
                                    <div className="glass-panel glass-static rounded-xl p-8 md:p-12">
                                        <h3 className="text-2xl font-bold tracking-wider uppercase mb-2">Nothing scheduled yet</h3>
                                        <p className="helper-text mb-0">Watch this space. The next community event will land here.</p>
                                    </div>
                                )}

                                {pastEvents.length > 0 && (
                                    <section className="space-y-4 md:space-y-6">
                                        <h3 className="text-sm font-bold tracking-[0.3em] uppercase text-gray-400 px-1">Past</h3>
                                        <div className="space-y-8 md:space-y-10">
                                            {pastEvents.map((event) => (
                                                <EventBanner key={event.id} event={event} badge="Past" />
                                            ))}
                                        </div>
                                    </section>
                                )}
                            </div>
                        )}

                        <footer className="mt-8 py-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center text-gray-200 text-sm">
                            <a href="/" className="hover:text-white transition mb-4 md:mb-0">← Back home</a>
                            <div>&copy; 2026 PakGameDev Community.</div>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
