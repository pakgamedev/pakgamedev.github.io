<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakistani Games on itch.io: Community List | PakGameDev</title>
    <meta name="description" content="Browse free and commercial games by Pakistani developers on itch.io. Maintained with Pakistan Game Dev, plus steps to get your game listed.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <link rel="canonical" href="https://pakgamedev.com/itch-games">
    <link rel="alternate" type="text/plain" href="https://pakgamedev.com/llms.txt" title="LLM summary">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pakistan Game Dev">
    <meta property="og:url" content="https://pakgamedev.com/itch-games">
    <meta property="og:title" content="Pakistani Games on itch.io: Community List | PakGameDev">
    <meta property="og:description" content="Free and commercial games by Pakistani developers on itch.io, gathered in one place by PakGameDev.">
    <meta property="og:image" content="https://pakgamedev.com/files/itch-preview.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pakistani Games on itch.io: Community List | PakGameDev">
    <meta name="twitter:description" content="Free and commercial games by Pakistani developers on itch.io, gathered in one place by PakGameDev.">
    <meta name="twitter:image" content="https://pakgamedev.com/files/itch-preview.jpg">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pakistani Games On Itch.io" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Pakistani Games on itch.io",
      "url": "https://pakgamedev.com/itch-games",
      "description": "Community list of free and commercial games by Pakistani developers on itch.io.",
      "isPartOf": { "@type": "WebSite", "name": "Pakistan Game Dev", "url": "https://pakgamedev.com/" }
    }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=itch-cta-sm">
</head>
<body>
    <div id="root">
        <main>
            <h1>Pakistani Games on itch.io</h1>
            <p>Many Pakistani developers upload free and commercial games on itch.io. This Pakistan Game Dev list gathers them in one place and explains how to get your game indexed and tagged.</p>
            <p><a href="https://pakgamedev.com/games">All Pakistani game catalogues</a> · <a href="https://pakgamedev.com/">Home</a></p>
        </main>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const joinSteps = [
            {
                n: "01",
                title: "Publish on itch.io",
                body: "Upload your game (free or paid). Browser builds are easiest for players to try."
            },
            {
                n: "02",
                title: "Get indexed",
                body: "Your game must show up in itch search. If it doesn’t, follow the indexing steps below."
            },
            {
                n: "03",
                title: "Add the tag",
                body: "Add the tag pakistani on your game page. That’s the opt-in for this community list."
            }
        ];

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [showIndexHelp, setShowIndexHelp] = useState(false);

            const getOrCreateAvatarSeed = () => {
                const storageKey = 'pakgamedev_avatarSeed';
                try {
                    let seed = localStorage.getItem(storageKey);
                    if (!seed) {
                        seed = Math.random().toString(36).substring(2);
                        localStorage.setItem(storageKey, seed);
                    }
                    return seed;
                } catch (error) {
                    return Math.random().toString(36).substring(2);
                }
            };

            const [avatarSeed] = useState(getOrCreateAvatarSeed);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return (
                <div className="relative min-h-screen text-white selection:bg-green-500 selection:text-black">
                    <div className="bg-animated"></div>
                    <div className="scanlines"></div>

                    <nav className="relative z-10 flex items-center justify-between px-8 py-6 backdrop-blur-sm bg-black/20 border-b border-white/5">
                        <a href="/" className="flex items-center gap-4 no-underline text-white">
                            <div className="w-10 h-10 bg-green-600 rounded flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(22,163,74,0.6)]">
                                <img className="rounded" src="files/community-animated-icon.png" alt="Community Icon" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-wider uppercase">Pakistan Game Dev</h1>
                                <p className="text-xs text-green-400 tracking-[0.2em] uppercase">itch.io Games</p>
                            </div>
                        </a>
                        <div className="flex items-center gap-4 text-xl font-light">
                            <a href="games" className="hidden sm:inline text-sm uppercase tracking-widest text-gray-400 hover:text-green-400 transition no-underline">Games hub</a>
                            <i className="fa-solid fa-wifi text-xs text-green-500"></i>
                            <span className="text-lg tracking-wider">{formatTime(currentTime)}</span>
                            <div className="w-8 h-8 rounded-full bg-gray-700 overflow-hidden border border-gray-500">
                                <img src={`https://api.dicebear.com/9.x/thumbs/svg?seed=${avatarSeed}`} alt="User" />
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10 px-4 md:px-8 lg:px-10 py-8 md:py-12 max-w-[90rem] mx-auto space-y-12 md:space-y-16">

                        <section className="max-w-4xl">
                            <p className="text-xs font-bold uppercase tracking-[0.3em] text-red-400 mb-3">
                                <i className="fa-brands fa-itch-io mr-2"></i> Community catalogue
                            </p>
                            <h2 className="text-4xl md:text-6xl font-bold mb-4 tracking-wide leading-tight">
                                PAKISTANI GAMES ON <span className="text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400">ITCH.IO</span>
                            </h2>
                            <p className="helper-text lead mb-0 max-w-3xl">
                                Pakistani developers have been shipping free and commercial games on itch for years, and a lot of them stay hard to find. This opt-in list gathers them in one place.
                            </p>
                        </section>

                        {/* Primary CTA - cinematic banner */}
                        <section>
                            <a
                                href="https://itch.io/games/tag-pakistani"
                                target="_blank"
                                rel="noopener noreferrer"
                                className="itch-cta group no-underline text-white"
                            >
                                <div className="itch-cta__media" aria-hidden="true">
                                    <img src="files/itch-preview.jpg" alt="" />
                                </div>
                                <div className="itch-cta__shade" aria-hidden="true"></div>
                                <div className="itch-cta__body">
                                    <span className="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-red-400 mb-2">
                                        <i className="fa-brands fa-itch-io"></i>
                                        Live list · tag:pakistani
                                    </span>
                                    <h3 className="text-2xl md:text-4xl font-extrabold tracking-wide leading-tight uppercase group-hover:text-green-400 transition-colors duration-300">
                                        Browse the list
                                    </h3>
                                    <p className="mt-2 text-sm md:text-base text-gray-200/90 max-w-xl leading-snug">
                                        Open itch.io’s Pakistani tag and play, rate, and discover games from the community.
                                    </p>
                                    <span className="itch-cta__action">
                                        itch.io/games/tag-pakistani <i className="fa-solid fa-arrow-right"></i>
                                    </span>
                                </div>
                            </a>
                        </section>

                        {/* How to join - scannable steps */}
                        <section>
                            <div className="flex items-end justify-between mb-6 px-1">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-green-500 pl-3">How to be on the list</h3>
                                <span className="meta-text hidden md:block">Opt in · three steps</span>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                                {joinSteps.map((step) => (
                                    <div key={step.n} className="itch-step glass-panel glass-static rounded-xl p-6 md:p-8">
                                        <span className="text-4xl md:text-5xl font-extrabold text-green-500/40 tracking-tighter leading-none">{step.n}</span>
                                        <h4 className="mt-4 text-2xl font-bold tracking-wide uppercase">{step.title}</h4>
                                        <p className="helper-text mb-0 mt-2">{step.body}</p>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Indexing help */}
                        <section className="space-y-4">
                            <div className="flex items-end justify-between mb-2 px-1">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-orange-500 pl-3">Indexing help</h3>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
                                <div className="glass-panel glass-static rounded-xl p-6 md:p-8">
                                    <div className="flex items-center gap-3 mb-3">
                                        <span className="w-10 h-10 rounded-full bg-green-500/15 border border-green-500/30 flex items-center justify-center text-green-400">
                                            <i className="fa-solid fa-magnifying-glass"></i>
                                        </span>
                                        <h4 className="text-xl font-bold uppercase tracking-wide mb-0">Already indexed?</h4>
                                    </div>
                                    <p className="helper-text">
                                        Search for your game by name on itch.io. If it appears in results, it’s indexed. Just add the <span className="text-green-400 font-semibold">pakistani</span> tag and you’re on the list.
                                    </p>
                                    <p className="helper-text mb-0 text-gray-400">
                                        Indexing also helps your game show up in search, new, upcoming, and popular charts.
                                    </p>
                                </div>

                                <div className="glass-panel glass-static rounded-xl p-6 md:p-8">
                                    <div className="flex items-center gap-3 mb-3">
                                        <span className="w-10 h-10 rounded-full bg-orange-500/15 border border-orange-500/30 flex items-center justify-center text-orange-400">
                                            <i className="fa-solid fa-triangle-exclamation"></i>
                                        </span>
                                        <h4 className="text-xl font-bold uppercase tracking-wide mb-0">Not in search?</h4>
                                    </div>
                                    <p className="helper-text">
                                        Follow itch’s indexing docs. If you meet the requirements and still aren’t indexed after about a week, email support and ask politely. Include your game link.
                                    </p>
                                    <div className="flex flex-col sm:flex-row gap-3 mt-2">
                                        <a
                                            href="https://itch.io/docs/creators/getting-indexed#publishing-vs-indexing/getting-indexed"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg border border-white/15 bg-white/5 hover:border-green-500/50 hover:text-green-400 transition text-sm font-bold uppercase tracking-widest no-underline text-white"
                                        >
                                            Read docs <i className="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                                        </a>
                                        <a
                                            href="mailto:support@itch.io"
                                            className="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg border border-white/15 bg-white/5 hover:border-green-500/50 hover:text-green-400 transition text-sm font-bold uppercase tracking-widest no-underline text-white"
                                        >
                                            support@itch.io
                                        </a>
                                    </div>
                                </div>
                            </div>

                            <button
                                type="button"
                                onClick={() => setShowIndexHelp(!showIndexHelp)}
                                className="w-full text-left glass-panel rounded-xl px-6 py-4 flex items-center justify-between gap-4 cursor-pointer border border-white/10 hover:border-green-500/40 transition"
                            >
                                <span className="font-bold uppercase tracking-widest text-sm md:text-base">
                                    {showIndexHelp ? 'Hide' : 'More detail'}: new accounts &amp; support tips
                                </span>
                                <i className={`fa-solid fa-chevron-${showIndexHelp ? 'up' : 'down'} text-green-400`}></i>
                            </button>

                            {showIndexHelp && (
                                <div className="glass-panel glass-static rounded-xl p-6 md:p-8 space-y-4">
                                    <p className="helper-text mb-0">
                                        Automatic indexing often doesn’t kick in until you’re an established, trusted itch.io user. Most new accounts need to contact support once to get a first game indexed. That detail is easy to miss in the docs.
                                    </p>
                                    <p className="helper-text mb-0">
                                        When you write to <a href="mailto:support@itch.io" className="text-green-400 hover:underline">support@itch.io</a>, be polite, link the game, and confirm you’ve met the publishing requirements in the docs. After you’re indexed, the <span className="text-green-400 font-semibold">pakistani</span> tag is enough to appear on this list.
                                    </p>
                                </div>
                            )}
                        </section>

                        <footer className="pt-4 pb-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center text-gray-200 text-sm gap-4">
                            <div className="flex gap-6">
                                <a href="games" className="hover:text-white transition no-underline text-gray-300">← Games hub</a>
                                <a href="/" className="hover:text-white transition no-underline text-gray-300">Home</a>
                            </div>
                            <div>&copy; 2026 PakGameDev Community.</div>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
