<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Review List — Award Judges Only | Pak Game Awards</title>
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="2026 Review List — Award Judges Only">
    <meta property="og:image" content="https://pakgamedev.com/files/awards_logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://pakgamedev.com/files/awards_logo.png">
    <meta name="description" content="Private review list of 2026 Pakistani games for Pak Game Awards judges. Review deadline: November 30.">
    <meta property="og:description" content="Private review list of 2026 Pakistani games for Pak Game Awards judges. Review deadline: November 30.">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Award Judges 2026" />
    <link rel="manifest" href="/site.webmanifest" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const consideredGames = [
            { name: "The Last Delivery Man On Earth", url: "https://store.steampowered.com/app/3736240/", access: "Keys provided" },
            { name: "Nightmarena", url: "https://store.steampowered.com/app/3666030/", access: "Demo" },
            { name: "Table 9", url: "https://store.steampowered.com/app/4500150/", access: "Keys provided" },
            { name: "Bladefall", url: "https://store.steampowered.com/app/3066110/", access: "Free" },
            { name: "This Game is Simple", url: "https://store.steampowered.com/app/4330090/", access: "Free" },
            { name: "Hollowforge", url: "https://store.steampowered.com/app/3281810/", access: "Keys provided" },
            { name: "CoreBreaker: Desktop Swarm", url: "https://store.steampowered.com/app/4600920/", access: "Demo" },
            { name: "From Devil's Womb", url: "https://store.steampowered.com/app/4282810/", access: "Keys provided" },
            { name: "Hearse Hero", url: "https://store.steampowered.com/app/4159710/", access: "Demo" },
            { name: "Too Many Balls", url: "https://store.steampowered.com/app/4627590/", access: "Demo" },
            { name: "Pestilence", url: "https://store.steampowered.com/app/3525940/", access: "Keys, pending" },
            { name: "Her Revenge", url: "https://store.steampowered.com/app/4952170/", access: "Keys provided" },
            { name: "Hemobloom", url: "https://store.steampowered.com/app/2435000/", access: "Keys provided" },
            { name: "Red Glare The Reckoning", url: "https://store.steampowered.com/app/4935230/", access: "Demo" },
            { name: "One Face at a Time", url: "https://g2playstudios.itch.io/one-face-at-a-time", access: "Free · itch.io" },
            { name: "Retro Dodge Rumble", url: "https://mo-shayan.itch.io/retro-dodge-rumble", access: "Free · itch.io" },
            { name: "Dust & Stars", url: "https://nyx0131.itch.io/dustandstars", access: "Free · itch.io" },
        ];

        const uncertainGames = [
            { name: "Ramen Haven", url: "https://store.steampowered.com/app/5101750/", access: "Paid · Coming Soon" },
            { name: "FOGBOUND", url: "https://store.steampowered.com/app/4140990/", access: "Paid · Coming Soon" },
            { name: "Bloodsmith", url: "https://store.steampowered.com/app/3113350/", access: "Paid · Coming Soon" },
        ];

        const rejectedGames = [
            { name: "BitSlaps", url: "https://store.steampowered.com/app/3303200/", reason: "Multiplayer focused, not easy to review" },
            { name: "Urban Ascend", url: "https://store.steampowered.com/app/4205730/", reason: "Low quality, suspected asset flip / slop farm" },
            { name: "Please Don't Shoot the Humans", url: "https://store.steampowered.com/app/4246220/", reason: "Low quality, suspected asset flip / slop farm" },
            { name: "Synth Laser", url: "https://store.steampowered.com/app/3966300/", reason: "Low quality" },
            { name: "Bitter Harvest", url: "https://store.steampowered.com/app/3840950/", reason: "Low quality, suspected asset flip / slop farm" },
            { name: "Alien Market Simulator", url: "https://store.steampowered.com/app/3215290/", reason: "Released in early access previous year" },
            { name: "The Last Elf", url: "https://store.steampowered.com/app/4659370/", reason: "AI use" },
            { name: "The Last Hope: Exodus", url: "https://store.steampowered.com/app/4065490/", reason: "Low quality, AI use" },
            { name: "Invisible Ascent", url: "https://store.steampowered.com/app/3513850/", reason: "Low quality, AI use" },
            { name: "Click and Cast", url: "https://store.steampowered.com/app/4827230/", reason: "Low quality, AI use" },
            { name: "Fit Happens: A Clothing Shop Simulator", url: "https://store.steampowered.com/app/4362790/", reason: "Low quality, suspected asset flip / slop farm" },
            { name: "Galaxy Cadet", url: "https://store.steampowered.com/app/4594650/", reason: "Low quality, suspected asset flip / slop farm" },
            { name: "Gunstoppable", url: "https://store.steampowered.com/app/3724710/", reason: "Game by a judge, conflict of interest" },
            { name: "Dealmaster", url: "https://store.steampowered.com/app/4010680/", reason: "AI use" },
            { name: "Medieval Decklords", url: "https://store.steampowered.com/app/4274210/", reason: "AI use" },
            { name: "Driving Test Simulator", url: "https://store.steampowered.com/app/4034490/", reason: "Doesn't fit games category" },
            { name: "Prison Escape io", url: "https://store.steampowered.com/app/3583470/", reason: "Low quality, AI use and multiplayer" },
            { name: "Sweep Together", url: "https://store.steampowered.com/app/5258740/", reason: "Out of 2026 window" },
            { name: "Did You See That?", url: "https://store.steampowered.com/app/4830110/", reason: "Multiplayer focused" },
            { name: "Duoshift", url: "https://store.steampowered.com/app/3515450/", reason: "Out of 2026 window" },
        ];

        const accessBadgeClass = (access) => {
            if (access.startsWith("Keys provided")) return "bg-green-500/20 text-green-400 border-green-500/40";
            if (access.startsWith("Keys")) return "bg-yellow-500/20 text-yellow-400 border-yellow-500/40";
            if (access.startsWith("Free")) return "bg-blue-500/20 text-blue-300 border-blue-500/40";
            if (access === "Demo") return "bg-cyan-500/20 text-cyan-300 border-cyan-500/40";
            return "bg-white/10 text-gray-300 border-white/20";
        };

        const GameTable = ({ rows, columns }) => (
            <div className="glass-panel glass-static rounded-xl overflow-hidden">
                <div className="overflow-x-auto">
                    <table className="w-full text-left">
                        <thead>
                            <tr className="border-b border-white/10 bg-black/30">
                                {columns.map((col) => (
                                    <th key={col.key} className="px-4 py-3 text-xs font-bold uppercase tracking-widest text-gray-400">
                                        {col.label}
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map((row, i) => (
                                <tr key={row.name} className={`border-b border-white/5 ${i % 2 === 0 ? "" : "bg-white/[0.02]"}`}>
                                    {columns.map((col) => (
                                        <td key={col.key} className="px-4 py-3 align-middle">
                                            {col.render(row)}
                                        </td>
                                    ))}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const nominationCategories = [
            "Outstanding Visuals",
            "Outstanding Story",
            "Outstanding Audio",
            "Outstanding Original Music",
            "Outstanding Player Experience",
            "Outstanding Game Design",
            "Outstanding Technical Excellence",
            "Best Local Culture Integration",
            "Best Prototype/Unfinished Game",
            "Most Anticipated Game",
            "Most Ambitious Concept",
            "Most Innovative Feature In A Game",
        ];

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const nominationsStorageKey = "pakgamedev_judges2026_nominations";

            const loadNominations = () => {
                const blank = Object.fromEntries(nominationCategories.map((c) => [c, ""]));
                try {
                    const raw = localStorage.getItem(nominationsStorageKey);
                    if (!raw) return blank;
                    const saved = JSON.parse(raw);
                    return Object.fromEntries(
                        nominationCategories.map((c) => [c, typeof saved[c] === "string" ? saved[c] : ""])
                    );
                } catch (error) {
                    return blank;
                }
            };

            const [rejectedOpen, setRejectedOpen] = useState(false);
            const [copyStatus, setCopyStatus] = useState("");
            const [nominations, setNominations] = useState(loadNominations);

            useEffect(() => {
                try {
                    localStorage.setItem(nominationsStorageKey, JSON.stringify(nominations));
                } catch (error) {
                    // Ignore storage failures (private mode, quota, etc.)
                }
            }, [nominations]);

            useEffect(() => {
                const onStorage = (event) => {
                    if (event.key !== nominationsStorageKey || event.newValue == null) return;
                    try {
                        const saved = JSON.parse(event.newValue);
                        setNominations(
                            Object.fromEntries(
                                nominationCategories.map((c) => [c, typeof saved[c] === "string" ? saved[c] : ""])
                            )
                        );
                    } catch (error) {
                        // Ignore malformed cross-tab updates
                    }
                };
                window.addEventListener("storage", onStorage);
                return () => window.removeEventListener("storage", onStorage);
            }, []);

            const copyNominations = async () => {
                const text = nominationCategories
                    .map((category) => `${category}: ${nominations[category].trim() || "None"}`)
                    .join("\n");
                try {
                    await navigator.clipboard.writeText(text);
                    setCopyStatus("Copied");
                } catch (error) {
                    setCopyStatus("Copy failed");
                }
                setTimeout(() => setCopyStatus(""), 2000);
            };

            const getOrCreateAvatarSeed = () => {
                const storageKey = "pakgamedev_avatarSeed";
                try {
                    let seed = localStorage.getItem(storageKey);
                    if (!seed) {
                        seed = Math.random().toString(36).substring(2);
                        localStorage.setItem(storageKey, seed);
                    }
                    return seed;
                } catch (error) {
                    return Math.random().toString(36).substring(2);
                }
            };

            const [avatarSeed] = useState(getOrCreateAvatarSeed);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (date) =>
                date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

            const consideredColumns = [
                {
                    key: "name",
                    label: "Game",
                    render: (row) => (
                        <a href={row.url} target="_blank" rel="noopener noreferrer" className="font-bold text-lg hover:text-green-400 transition">
                            {row.name} <i className="fa-solid fa-arrow-up-right-from-square text-xs opacity-50 ml-1"></i>
                        </a>
                    ),
                },
                {
                    key: "access",
                    label: "Access",
                    render: (row) => (
                        <span className={`inline-block text-xs font-bold uppercase tracking-wider px-2 py-1 rounded border ${accessBadgeClass(row.access)}`}>
                            {row.access}
                        </span>
                    ),
                },
            ];

            const rejectedColumns = [
                {
                    key: "name",
                    label: "Game",
                    render: (row) => (
                        <a href={row.url} target="_blank" rel="noopener noreferrer" className="font-bold text-lg text-gray-300 hover:text-green-400 transition">
                            {row.name} <i className="fa-solid fa-arrow-up-right-from-square text-xs opacity-50 ml-1"></i>
                        </a>
                    ),
                },
                {
                    key: "reason",
                    label: "Reason",
                    render: (row) => <span className="text-gray-400">{row.reason}</span>,
                },
            ];

            return (
                <div className="relative min-h-screen text-white selection:bg-green-500 selection:text-black">
                    <div className="bg-animated"></div>
                    <div className="scanlines"></div>

                    <nav className="relative z-10 flex items-center justify-between px-8 py-6 backdrop-blur-sm bg-black/20 border-b border-white/5">
                        <a href="/" className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-green-600 rounded flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(22,163,74,0.6)]">
                                <img className="rounded" src="files/community-animated-icon.png" alt="Community Icon" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-wider uppercase">Pakistan Game Dev</h1>
                                <p className="text-xs text-green-400 tracking-[0.2em] uppercase">Community in Pakistan</p>
                            </div>
                        </a>

                        <a href="awards" className="hidden md:flex items-center gap-4">
                            <img className="w-10 h-[12.9]" src="files/awards_logo.png" alt="Awards Logo" />
                            <div className="mt-0 mb-0">
                                <h1 className="text-2xl font-bold tracking-wider uppercase leading-[0.75]">Pak<br/>Game<br/>Awards</h1>
                            </div>
                        </a>

                        <div className="flex items-center gap-4 text-xl font-light">
                            <i className="fa-solid fa-wifi text-xs text-green-500"></i>
                            <span className="text-lg tracking-wider">{formatTime(currentTime)}</span>
                            <div className="w-8 h-8 rounded-full bg-gray-700 overflow-hidden border border-gray-500">
                                <img src={`https://api.dicebear.com/9.x/thumbs/svg?seed=${avatarSeed}`} alt="User" />
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10 p-4 md:p-10 max-w-5xl mx-auto space-y-12">
                        <section className="mb-4">
                            <div className="inline-block mb-4 px-3 py-1 text-xs font-bold uppercase tracking-widest bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 rounded">
                                Award Judges Only
                            </div>
                            <h2 className="text-4xl md:text-6xl font-bold mb-3">
                                2026 GAMES TO <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-green-600">REVIEW</span>
                            </h2>
                            <p className="helper-text lead max-w-3xl">
                                Review list for Pak Game Awards judges. Pakistani games releasing in 2026 (including announced / coming soon).
                                Keys are distributed privately — this page only notes when keys are available.
                            </p>
                            <p className="text-sm text-yellow-400/90 mt-4 uppercase tracking-widest font-bold">
                                Review deadline: November 30
                            </p>
                            <p className="meta-text mt-3">
                                {consideredGames.length} considered · {uncertainGames.length} uncertain 2026 · {rejectedGames.length} rejected · Updated at 2026-10-30
                            </p>
                        </section>

                        <section>
                            <div className="flex items-end justify-between mb-4 px-1">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-green-500 pl-3">
                                    Considered for review
                                </h3>
                                <span className="text-xs text-green-500 uppercase tracking-widest">{consideredGames.length} games</span>
                            </div>
                            <GameTable rows={consideredGames} columns={consideredColumns} />
                        </section>

                        <section>
                            <div className="flex items-end justify-between mb-4 px-1 gap-4">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-purple-500 pl-3">
                                    Nominations template
                                </h3>
                                <button
                                    type="button"
                                    onClick={copyNominations}
                                    className="shrink-0 text-xs font-bold uppercase tracking-widest px-3 py-2 rounded border border-purple-500/40 bg-purple-500/10 text-purple-300 hover:bg-purple-500/20 hover:border-purple-400 transition flex items-center gap-2"
                                >
                                    <i className={`fa-solid ${copyStatus === "Copied" ? "fa-check" : "fa-copy"}`}></i>
                                    {copyStatus || "Copy"}
                                </button>
                            </div>
                            <p className="helper-text">
                                One or more nominations per category. Write None if you have no pick. Fill in, Copy and send it to organizer!
                            </p>
                            <div className="glass-panel glass-static rounded-xl overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="border-b border-white/10 bg-black/30">
                                                <th className="px-4 py-3 text-xs font-bold uppercase tracking-widest text-gray-400">Category</th>
                                                <th className="px-4 py-3 text-xs font-bold uppercase tracking-widest text-gray-400">Nomination</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {nominationCategories.map((category, i) => (
                                                <tr key={category} className={`border-b border-white/5 ${i % 2 === 0 ? "" : "bg-white/[0.02]"}`}>
                                                    <td className="px-4 py-3 font-bold text-lg">{category}</td>
                                                    <td className="px-4 py-3">
                                                        <input
                                                            type="text"
                                                            value={nominations[category]}
                                                            onChange={(e) =>
                                                                setNominations({
                                                                    ...nominations,
                                                                    [category]: e.target.value,
                                                                })
                                                            }
                                                            placeholder="Your nomination here"
                                                            className="w-full bg-transparent border border-white/10 rounded px-3 py-2 text-white placeholder:text-slate-400 placeholder:italic focus:outline-none focus:border-green-500/60 focus:bg-white/5 transition"
                                                        />
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>

                        <section>
                            <button
                                type="button"
                                onClick={() => setRejectedOpen(!rejectedOpen)}
                                className="w-full flex items-center justify-between mb-4 px-1 text-left group"
                                aria-expanded={rejectedOpen}
                            >
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-red-500 pl-3">
                                    Rejected
                                    <span className="ml-3 text-xs font-bold text-red-400/80 normal-case tracking-widest">
                                        ({rejectedGames.length})
                                    </span>
                                </h3>
                                <span className="text-xs text-red-400 uppercase tracking-widest flex items-center gap-2">
                                    {rejectedOpen ? "Hide" : "Show"}
                                    <i className={`fa-solid fa-chevron-${rejectedOpen ? "up" : "down"} transition-transform`}></i>
                                </span>
                            </button>
                            {rejectedOpen && (
                                <>
                                    <p className="helper-text">
                                        Not on the review list. Included so judges know why they were excluded. Shoutout if you think I missed something!
                                    </p>
                                    <GameTable rows={rejectedGames} columns={rejectedColumns} />
                                </>
                            )}
                        </section>

                        <section>
                            <div className="flex items-end justify-between mb-4 px-1">
                                <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-yellow-500 pl-3">
                                    May not release in 2026
                                </h3>
                                <span className="text-xs text-yellow-500 uppercase tracking-widest">{uncertainGames.length} games</span>
                            </div>
                            <p className="helper-text">
                                Listed for awareness; release timing is uncertain.
                            </p>
                            <GameTable rows={uncertainGames} columns={consideredColumns} />
                        </section>

                        <footer className="mt-12 py-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center text-gray-200 text-sm">
                            <div className="flex gap-6 mb-4 md:mb-0">
                                <a href="/" className="hover:text-white transition">Home</a>
                                <a href="awards" className="hover:text-white transition">Awards</a>
                            </div>
                            <div className="flex items-center gap-2">
                                <span>JUDGES LIST</span>
                                <span className="text-yellow-500 font-bold">PRIVATE</span>
                            </div>
                            <div className="mt-4 md:mt-0">
                                &copy; 2026 PakGameDev Community.
                            </div>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
