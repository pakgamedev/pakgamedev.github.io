<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Jams - Pakistan Game Dev</title>
    <meta property="og:title" content="Game Jams - Pakistan Game Dev">
    <meta property="og:image" content="https://pakgamedev.com/files/preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://pakgamedev.com/files/preview.png">
    <meta name="description" content="Pakistan Game Dev jams past and present. Join the next jam, play submissions, and celebrate what the community builds together.">
    <meta property="og:description" content="Pakistan Game Dev jams past and present. Join the next jam, play submissions, and celebrate what the community builds together.">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pak Game Dev Jams" />
    <link rel="manifest" href="/site.webmanifest" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="data/content-data.js"></script>
    <script src="js/content.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [featuredJam, setFeaturedJam] = useState(null);
            const [pastJams, setPastJams] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const getOrCreateAvatarSeed = () => {
                const storageKey = 'pakgamedev_avatarSeed';
                try {
                    let seed = localStorage.getItem(storageKey);
                    if (!seed) {
                        seed = Math.random().toString(36).substring(2);
                        localStorage.setItem(storageKey, seed);
                    }
                    return seed;
                } catch (err) {
                    return Math.random().toString(36).substring(2);
                }
            };

            const [avatarSeed] = useState(getOrCreateAvatarSeed);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                PakContent.load()
                    .then((data) => {
                        setFeaturedJam(PakContent.featured(data, 'jam'));
                        setPastJams(PakContent.past(data, 'jam'));
                        setLoading(false);
                    })
                    .catch((err) => {
                        console.error(err);
                        setError('Could not load jams.');
                        setLoading(false);
                    });
            }, []);

            const formatTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return (
                <div className="relative min-h-screen text-white selection:bg-green-500 selection:text-black">
                    <div className="bg-animated"></div>
                    <div className="scanlines"></div>

                    <nav className="relative z-10 flex items-center justify-between px-8 py-6 backdrop-blur-sm bg-black/20 border-b border-white/5">
                        <a href="/" className="flex items-center gap-4 no-underline text-white">
                            <div className="w-10 h-10 bg-green-600 rounded flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(22,163,74,0.6)]">
                                <img className="rounded" src="files/community-animated-icon.png" alt="Community Icon" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-wider uppercase">Pakistan Game Dev</h1>
                                <p className="text-xs text-green-400 tracking-[0.2em] uppercase">Game Jams</p>
                            </div>
                        </a>
                        <div className="flex items-center gap-4 text-xl font-light">
                            <i className="fa-solid fa-wifi text-xs text-green-500"></i>
                            <span className="text-lg tracking-wider">{formatTime(currentTime)}</span>
                            <div className="w-8 h-8 rounded-full bg-gray-700 overflow-hidden border border-gray-500">
                                <img src={`https://api.dicebear.com/9.x/thumbs/svg?seed=${avatarSeed}`} alt="User" />
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10 p-4 md:p-10 max-w-7xl mx-auto space-y-12">
                        <section>
                            <h2 className="text-4xl md:text-6xl font-bold mb-2">
                                GAME <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-green-600">JAMS</span>
                            </h2>
                            <p className="helper-text lead max-w-3xl">
                                Short bursts of making games with the community. Upcoming jams sit at the top; everything we have run is archived below.
                            </p>
                        </section>

                        {loading && (
                            <p className="helper-text">Loading jams…</p>
                        )}
                        {error && (
                            <p className="text-red-400">{error}</p>
                        )}

                        {!loading && !error && (
                            <>
                                <section>
                                    <div className="flex items-end justify-between mb-4 px-1">
                                        <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-yellow-500 pl-3">Upcoming</h3>
                                    </div>

                                    {featuredJam ? (
                                        <a target="_blank" rel="noopener noreferrer" href={featuredJam.url} className="block glass-panel rounded-xl overflow-hidden transition-all duration-500 hover:shadow-[0_0_40px_rgba(22,163,74,0.6)] group no-underline">
                                            <div className="flex flex-col md:flex-row items-center p-6 md:p-8">
                                                <div className="md:w-1/4 relative mb-4 md:mb-0 rounded-xl overflow-hidden h-48 w-full">
                                                    <img src={featuredJam.image} alt={featuredJam.title} className="absolute inset-0 w-full h-full object-cover opacity-40 group-hover:opacity-90 transition-opacity duration-500" />
                                                </div>
                                                <div className="md:w-3/4 md:pl-8 text-center md:text-left">
                                                    <span className="text-xs text-gray-400 font-semibold uppercase tracking-widest block mb-1">{(featuredJam.status || 'upcoming').toUpperCase()} | {featuredJam.date}</span>
                                                    <h3 className="text-3xl md:text-4xl font-extrabold tracking-wider leading-tight mb-2 text-white group-hover:text-green-400 transition">{featuredJam.title}</h3>
                                                    <p className="text-gray-300 max-w-xl mx-auto md:mx-0 text-xl">{featuredJam.desc}</p>
                                                    <div className="mt-3 flex justify-center md:justify-start items-center text-sm font-bold text-green-500 uppercase tracking-widest">
                                                        <span className="mr-2">Join on itch.io</span> <i className="fa-solid fa-arrow-right animate-pulse"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </a>
                                    ) : (
                                        <div className="glass-panel glass-static rounded-xl p-8 md:p-10 text-center md:text-left">
                                            <div className="flex flex-col md:flex-row md:items-center gap-6">
                                                <div className="w-16 h-16 rounded-full border border-yellow-500/40 bg-yellow-500/10 flex items-center justify-center text-3xl text-yellow-400 shrink-0 mx-auto md:mx-0">
                                                    <i className="fa-solid fa-hourglass-half"></i>
                                                </div>
                                                <div>
                                                    <h3 className="text-2xl font-bold tracking-wider uppercase mb-2">Next jam cooking</h3>
                                                    <p className="helper-text mb-0 max-w-2xl">
                                                        No jam is open right now. Follow the community channels and check back here — the next Pakistan Game Jam will be featured at the top when it goes live.
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </section>

                                <section>
                                    <div className="flex items-end justify-between mb-4 px-1">
                                        <h3 className="text-xl font-bold tracking-widest uppercase border-l-4 border-green-500 pl-3">Past Jams</h3>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        {pastJams.map((jam) => (
                                            <a target="_blank" rel="noopener noreferrer" href={jam.url} key={jam.id} className="glass-panel p-0 rounded-xl flex flex-col md:flex-row h-auto md:h-48 overflow-hidden group cursor-pointer transition-all duration-300 no-underline">
                                                <div className="md:w-2/5 relative overflow-hidden h-48 md:h-full">
                                                    <img src={jam.image} alt={jam.title} className="w-full h-full object-cover transition duration-700 group-hover:scale-110" />
                                                </div>
                                                <div className="md:w-3/5 p-6 flex flex-col justify-center">
                                                    <span className="text-xs text-gray-400 uppercase tracking-wider mb-2">{jam.date}</span>
                                                    <h4 className="text-xl font-bold mb-2 leading-tight text-white group-hover:text-green-400 transition">{jam.title}</h4>
                                                    <p className="text-gray-400 line-clamp-2 group-hover:text-gray-200">{jam.desc}</p>
                                                    {jam.winner && (
                                                        <p className="mt-2 text-sm text-yellow-400">Winner: {jam.winner}</p>
                                                    )}
                                                </div>
                                            </a>
                                        ))}
                                    </div>
                                </section>
                            </>
                        )}

                        <footer className="mt-12 py-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center text-gray-200 text-sm">
                            <a href="/" className="hover:text-white transition mb-4 md:mb-0">← Back home</a>
                            <div>&copy; 2026 PakGameDev Community.</div>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
